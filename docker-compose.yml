services:
  caddy:
    image: caddy:2-alpine
    container_name: eruvia_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-odoo.eruviabs.com}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - odoo
      - remote_mcp
    networks:
      - eruvia_net

  odoo:
    image: odoo:18.0
    container_name: eruvia_odoo
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/extra-addons
      - odoo_data:/var/lib/odoo
    networks:
      - eruvia_net

  db:
    image: postgres:16-alpine
    container_name: eruvia_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    networks:
      - eruvia_net

  redis:
    image: redis:7-alpine
    container_name: eruvia_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eruvia_net

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: eruvia_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://157.245.249.151:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-eruvia_secret_token_2026}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://odoo:${POSTGRES_PASSWORD}@db:5432/evolution_db?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://bot:5000/webhook/evolution
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_APPLICATION_STARTUP=false
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - db
      - redis
    networks:
      - eruvia_net

  bot:
    build:
      context: ./whatsapp-bot
      dockerfile: Dockerfile
    container_name: eruvia_bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "5000:5000"
    environment:
      - ODOO_URL=http://odoo:8069
      - ODOO_DB=eruvia
      - ODOO_USERNAME=info@eruviabs.com
      - ODOO_PASSWORD=Eruvia2026!
      - EVOLUTION_URL=http://evolution_api:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-eruvia_secret_token_2026}
      - EVOLUTION_INSTANCE=eruvia
      - AI_BASE_URL=${AI_BASE_URL:-https://api.moonshot.cn/v1}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL:-moonshot-v1-8k}
    depends_on:
      - odoo
      - evolution_api
    networks:
      - eruvia_net

  remote_mcp:
    build:
      context: ./remote-mcp
      dockerfile: Dockerfile
    container_name: eruvia_remote_mcp
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      - ODOO_URL=http://odoo:8069
      - ODOO_DB=eruvia
      - ODOO_USERNAME=info@eruviabs.com
      - ODOO_PASSWORD=Eruvia2026!
    depends_on:
      - odoo
    networks:
      - eruvia_net

networks:
  eruvia_net:
    driver: bridge

volumes:
  odoo_data:
  db_data:
  caddy_data:
  caddy_config:
  redis_data:
  evolution_instances:
